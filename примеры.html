<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Примеры работ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: #03050E;
            background-image: 
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0, 243, 255, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 90% 110%, rgba(124, 58, 237, 0.1) 0%, transparent 60%);
            color: #e0e0e0;
            line-height: 1.7;
            padding: 60px 20px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, transparent),
                radial-gradient(1px 1px at 60px 70px, #a0a0ff, transparent),
                radial-gradient(2px 2px at 120px 40px, #fff, transparent),
                radial-gradient(1px 1px at 180px 90px, #fff, transparent),
                radial-gradient(1px 1px at 250px 150px, #00f3ff, transparent);
            background-repeat: repeat;
            background-size: 300px 300px;
            opacity: 0.5;
            animation: twinkle 5s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Sora', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1.5px;
            line-height: 1;
            text-align: center;
            margin-bottom: 50px;
            text-shadow: none;
        }

        .example {
            border-radius: 24px;
            padding: 36px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 243, 255, 0.15);
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.08) 0%, rgba(3, 5, 14, 0.8) 60%);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            max-width: 840px;
            margin-left: auto;
            margin-right: auto;
        }

        .example:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border-color: rgba(0, 243, 255, 0.3);
        }

        .example img {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(0, 243, 255, 0.1);
            display: block;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .caption {
            font-family: 'Sora', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            margin: 10px 0 16px;
            color: #00f3ff;
            text-shadow: none;
        }

        .example p {
            color: #ffffff;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 0;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .example { padding: 24px; }
            body { padding: 30px 15px; }
        }
    </style>
</head>
<body>
    <h1>Примеры видео</h1>
    
    <div class="example">
        <div class="caption">Пример #1</div>
        <img src="https://i.imgur.com/GYKiK7X.jpeg" alt="Пример видео #1">
        <p>Не забудьте заменить юзернеймы ботов на актуальные!</p>
    </div>
    
    <div class="example">
        <div class="caption">Пример #2</div>
        <img src="https://i.imgur.com/5Jo6DeF.jpeg" alt="Пример видео #2">
        <p>Не забудьте заменить юзернеймы ботов на актуальные!</p>
    </div>
    
    <div class="example">
        <div class="caption">Пример #3</div>
        <img src="https://i.imgur.com/MFFopeF.jpeg" alt="Пример видео #3">
        <p>Не забудьте заменить юзернеймы ботов на актуальные!</p>
    </div>
</body>
</html>
